kind = "mobile"
previewPath = "/"
title = "Drug Lense"
description = "A cross-platform field drug-test evidence app for creating screening records, capturing test-strip evidence, routing reviews, and maintaining an auditable history across organizations."
version = "1.0.0"
id = "artifacts/safetest"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22639

[services.development]
run = "pnpm --filter @workspace/safetest run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/safetest", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/safetest", "run", "serve" ]

[services.env]
PORT = "22639"
BASE_PATH = "/"
